{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}Lotengo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/principal.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/barra_navegacion.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/barra_lateral.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/pie_pagina.css' %}">
    {% block page_css %}{% endblock %}
</head>
<body>
    {% include "componentes/barra_navegacion.html" %}
    <main id="contenido">
        {% block content %}{% endblock %}
    </main>
    {% include "componentes/pie_pagina.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/componentes/barra_navegacion.js' %}"></script>
    <script src="{% static 'js/componentes/barra_lateral.js' %}"></script>
    <script src="{% static 'js/componentes/pie_pagina.js' %}"></script>
    {% block page_js %}{% endblock %}
</body>
</html>
